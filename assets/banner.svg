<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Haroun Joudi, AI and full-stack engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14344D"/>
      <stop offset="1" stop-color="#087989"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <circle cx="1010" cy="60" r="150" fill="url(#glow)"/>
  <circle cx="1120" cy="250" r="90" fill="#ffffff" fill-opacity="0.06"/>
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="64" y="118" font-size="54" font-weight="700" letter-spacing="0.5">Haroun Joudi</text>
    <text x="66" y="160" font-size="22" font-weight="400" fill-opacity="0.92">AI engineer and full-stack developer</text>
    <text x="66" y="192" font-size="16" fill-opacity="0.78">CY Tech 2026 · three years of production code · LLM assistants, RAG, fine-tuning, MLOps</text>
  </g>
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">
    <rect x="64" y="222" width="222" height="36" rx="18" fill="#ffffff" fill-opacity="0.14"/>
    <text x="175" y="245" text-anchor="middle">LLM · RAG · fine-tuning</text>
    <rect x="298" y="222" width="236" height="36" rx="18" fill="#ffffff" fill-opacity="0.14"/>
    <text x="416" y="245" text-anchor="middle">Symfony · React · .NET · Python</text>
    <rect x="546" y="222" width="232" height="36" rx="18" fill="#ffffff" fill-opacity="0.14"/>
    <text x="662" y="245" text-anchor="middle">Docker · Kubernetes · GCP</text>
  </g>
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.8">
    <text x="1136" y="282" text-anchor="end">Paris area, France</text>
  </g>
</svg>
